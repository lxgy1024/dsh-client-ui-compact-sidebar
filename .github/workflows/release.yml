# Publish one version, in one motion.
#
# Pushing a tag like `v0.1.2` does three things that must not drift apart:
#   1. checks the tag names the version in package.json,
#   2. publishes to npm (skipped when that version is already on the registry),
#   3. creates the GitHub release, so the Releases page lists every version.
#
# Secrets: `NPM_TOKEN` (an npm automation/Granular token with publish rights on
# the @dshx scope). No OTP is involved because automation tokens bypass 2FA.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.1.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag names the package version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "${tag}" != "v${pkg}" ]; then
            echo "::error::tag ${tag} does not match package.json version ${pkg}"
            exit 1
          fi
          echo "version=${pkg}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Publish to npm unless this version is already there
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "${name}@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${{ steps.version.outputs.version }} is already published; skipping"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish --provenance --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::notice::release ${tag} already exists; leaving it alone"
            exit 0
          fi
          gh release create "${tag}" \
            --title "${tag}" \
            --generate-notes \
            --latest
